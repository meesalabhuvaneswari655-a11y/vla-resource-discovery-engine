[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-resource-discovery-engine"
version = "1.0.0"
description = "Intelligent Search & Ranking Engine for VLM and Robotics AI / VLA Resources"
readme = "README.md"
authors = [{ name = "Meghana", email = "researcher@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
    "altair>=5.0.0",
]

[project.scripts]
vla-search = "vla_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
